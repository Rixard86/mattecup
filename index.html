<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mattecup">
<meta name="theme-color" content="#0b1410">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>United Mattecup</title>
<style>
/* Layout: full-screen arcade on a floodlit night pitch — scoreboard top, pitch middle, hand of player cards bottom; maths sheet is a chalk tactics board */
@font-face{font-family:'Bungee';src:url(fonts/bungee-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-900-normal.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'Bungee';src:url(fonts/bungee-latin-ext-400-normal.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-ext-700-normal.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-ext-800-normal.woff2) format('woff2');font-weight:800;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-ext-900-normal.woff2) format('woff2');font-weight:900;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --night:#08110d; --pitch:#11402a; --pitch2:#0e3824; --line:rgba(255,255,255,.55);
  --chalk:#f4f2ea; --muted:#a9bfb2; --board:#17211d; --board2:#202d28;
  --red:#da291c; --red-deep:#8f170e; --gold:#fbe122; --ink:#0a0a0a;
  --ental:#ffd84d; --tiotal:#6fd3ff; --hundratal:#ff9ad5;
  --good:#5ee08a; --warn:#ffb340;
  --font-display:'Bungee','Arial Black',Impact,sans-serif;
  --font-body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--chalk);font:700 16px/1.4 var(--font-body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  background:
    radial-gradient(90% 55% at 15% -8%,rgba(255,255,235,.16),transparent 60%),
    radial-gradient(90% 55% at 85% -8%,rgba(255,255,235,.16),transparent 60%),
    repeating-linear-gradient(90deg,var(--pitch) 0 90px,var(--pitch2) 90px 180px);}
#app.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.center{align-items:center;text-align:center}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{display:block;margin:0 0 .45em;font:400 12px/1.35 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.h2{font:400 clamp(26px,4vw,40px)/1.22 var(--font-display)}
.muted{color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:48px;background:rgba(255,255,255,.1);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);font-weight:900;font-size:17px;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #b59f00}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-deep)}
.btn.big{font:400 clamp(18px,2.4vw,24px)/1.1 var(--font-display);padding:16px 26px;min-height:64px}
.btn.big small{display:block;font:800 13px var(--font-body);opacity:.75;margin-top:3px;letter-spacing:0}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{border:0;border-radius:999px;padding:8px 14px;min-height:40px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* club badge slot */
.badge{display:inline-grid;place-items:center;width:1em;height:1em;flex:none}
.badge img{width:100%;height:100%;object-fit:contain}
.badge .fallback{width:100%;height:100%;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 .07em var(--gold);display:grid;place-items:center;
  font:400 .34em/1 var(--font-display);color:var(--gold)}

/* TITLE */
.title-wrap{max-width:760px;margin:auto;padding-block:28px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.title-badge{font-size:clamp(90px,16vmin,150px);filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.logo{font:400 clamp(44px,9vw,96px)/.9 var(--font-display);letter-spacing:.01em}
.logo span{display:block}
.logo span:first-child{color:var(--red);-webkit-text-stroke:2px var(--gold);text-shadow:0 6px 0 rgba(0,0,0,.45)}
.logo span:last-child{color:var(--chalk);font-size:.62em;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.lede{font-size:clamp(17px,2.2vw,21px);max-width:34ch;color:var(--chalk)}
.menu{display:flex;flex-direction:column;gap:14px;align-items:stretch;width:min(460px,100%)}
.shelf{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(0,0,0,.35);border-radius:14px;padding:10px 16px;min-width:120px}
.stat b{display:block;font:400 26px var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* MAP */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hearts{display:flex;gap:6px;align-items:center;font-weight:900}
.heart{width:28px;height:26px}
.heart.lost{opacity:.22}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.node{background:rgba(0,0,0,.4);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--opp);min-width:0}
.node.now{background:rgba(0,0,0,.65);box-shadow:0 0 0 3px var(--gold)}
.node.done{opacity:.6}
.nstage{font:400 10px var(--font-display);letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.nname{font-weight:900;font-size:14px;line-height:1.15}
.ntick{font-size:12px;color:var(--good)}
.next-match{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:linear-gradient(110deg,rgba(218,41,28,.92),rgba(143,23,14,.92) 55%,var(--opp));border-radius:20px;padding:20px 22px}
.next-match h3{font:400 clamp(22px,3vw,32px)/1.22 var(--font-display);margin-block:6px}
.next-match .meta{font-size:14px;opacity:.85;margin-top:6px}
.next-match .eyebrow{color:var(--gold)}
.panelbox{background:rgba(0,0,0,.4);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panelbox h3{font:400 18px var(--font-display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;gap:6px;align-items:center}
.dchip i{font-style:normal;font:400 12px var(--font-display);color:var(--gold)}
.relics{display:flex;flex-wrap:wrap;gap:10px}
.relic{display:flex;gap:10px;align-items:center;background:rgba(251,225,34,.1);border-radius:12px;padding:8px 12px;font-size:14px}
.relic svg{width:28px;height:28px;color:var(--gold);flex:none}

/* MATCH */
.match{gap:10px;padding-block:10px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:12px;background:#050505;border-radius:14px;padding:8px 14px;
  box-shadow:inset 0 0 0 2px #222,0 6px 18px rgba(0,0,0,.4)}
.team{display:flex;align-items:center;gap:10px;font:400 clamp(13px,1.9vw,20px)/1 var(--font-display);min-width:0}
.team span.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.22;margin-block:-.11em}
.team.them{justify-content:flex-end;text-align:right}
.team .badge{font-size:38px}
.oppbadge{width:34px;height:34px;border-radius:50%;background:var(--opp);display:grid;place-items:center;font:400 11px var(--font-display);color:#000;flex:none}
.score{font:400 clamp(30px,5vw,48px)/1 var(--font-display);color:var(--gold);display:flex;gap:10px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(251,225,34,.5)}
.score i{font-style:normal;color:#666}
.clockbox{font:400 13px/1.1 var(--font-display);color:var(--chalk);text-align:right;background:#151515;border-radius:8px;padding:6px 10px}
.clockbox small{display:block;font:800 12px var(--font-body);color:var(--muted)}
.field{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.pitch{position:relative;flex:1;min-height:150px;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#1b6b3c 0 10%,#187038 10% 20%);box-shadow:inset 0 0 0 3px var(--line),0 10px 30px rgba(0,0,0,.35)}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid var(--line)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:min(22vmin,140px);aspect-ratio:1;border:3px solid var(--line);border-radius:50%;transform:translate(-50%,-50%)}
.box{position:absolute;top:22%;bottom:22%;width:12%;border:3px solid var(--line)}
.box.l{left:-3px;border-left:0}.box.r{right:-3px;border-right:0}
.goal{position:absolute;top:38%;bottom:38%;width:12px;background:repeating-linear-gradient(0deg,#fff 0 3px,transparent 3px 7px);border:3px solid #fff}
.goal.l{left:0;border-left:0}.goal.r{right:0;border-right:0}
#pitchSlot{position:absolute;inset:0;z-index:1}
#pitchSlot canvas{display:block;width:100%;height:100%}
.wall{position:absolute;display:flex;align-items:center;gap:8px;z-index:3;background:rgba(0,0,0,.6);border-radius:12px;padding:5px 12px;transition:opacity .2s}
.wall b{font:400 22px/1 var(--font-display)}
.wall span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.wall.mine{left:10px;top:10px;box-shadow:inset 0 0 0 3px var(--red)}
.wall.theirs{right:10px;bottom:10px;box-shadow:inset 0 0 0 3px var(--opp)}
.wall.off{opacity:.45}
.penview{position:absolute;inset:0;z-index:20;display:grid;grid-template-rows:auto 1fr auto;gap:8px;background:#05070b;border-radius:16px;overflow:hidden;padding-block:8px}
.penbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-inline:14px}
.pside{display:flex;align-items:center;gap:10px;font:400 18px var(--font-display)}
.pside.them{justify-content:flex-end}
.pmid{display:flex;flex-direction:column;align-items:center;gap:2px}
.pmid b{font:400 34px/1 var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums}
#penSlot{position:relative;min-height:0}
#penSlot canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.penfoot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-inline:14px;text-align:center;min-height:56px}
.penfoot p{font-size:19px;max-width:60ch}
.penfoot b{color:var(--gold)}
.overlay.low{place-items:end center;background:transparent;pointer-events:none;padding-bottom:12px}
.overlay.low .panel{pointer-events:auto;max-width:640px;padding:16px 20px;gap:10px}
.overlay.low .panel h2{font-size:clamp(22px,3vw,30px)}
.intent{position:absolute;top:10px;right:10px;z-index:4;background:rgba(0,0,0,.72);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;
  box-shadow:inset 0 0 0 2px var(--opp);max-width:58%}
.intent .eyebrow{color:var(--gold)}
.ivals{display:flex;gap:12px;font:400 22px var(--font-display)}
.ivals span{display:flex;align-items:center;gap:6px}
.ivals svg{width:24px;height:24px}
.intent.pulse{animation:pulse .6s 2}
.ihint{font:800 12px/1.3 var(--font-body);color:#fff;max-width:24ch}
.ihint.ok{color:#8dffad}.ihint.warn{color:#ffd2ca}
.wall,.intent{cursor:pointer}
.wall i{font:900 11px/1 var(--font-body);font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.infobox{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:16px}
.infobox .ib{width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;background:#0b0f16;color:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 0 0 3px var(--gold),0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.infobox h4{margin:0;font:400 24px/1.25 var(--font-display);color:var(--gold)}
.infobox p{font-size:16px;line-height:1.45}
.infobox .ex{display:block;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.infobox .btn{align-self:flex-end}
@keyframes pulse{50%{transform:scale(1.08)}}
.legend{position:absolute;left:10px;bottom:8px;z-index:4;font-size:12px;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:4px 8px;max-width:52%}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{background:rgba(0,0,0,.5);border-radius:12px;padding:8px 12px}
.mlabel{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.mlabel b{font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .5s}
.meter.me .bar i{background:linear-gradient(90deg,var(--red),#ff6b4a)}
.meter.them .bar i{background:var(--oppfill,var(--opp))}
.status{display:flex;gap:8px;flex-wrap:wrap;min-height:28px}
.tag{background:rgba(0,0,0,.5);border-radius:999px;padding:4px 12px;font-size:14px}
.tag.hot{background:var(--gold);color:var(--ink)}
.tag.fx{background:rgba(14,116,144,.75);box-shadow:inset 0 0 0 2px rgba(103,232,249,.5)}
.weather{position:absolute;inset:0;z-index:2;pointer-events:none}
.w-rain{background:repeating-linear-gradient(105deg,transparent 0 16px,rgba(186,230,253,.22) 16px 18px);background-size:120px 120px;animation:rainfall .45s linear infinite}
@keyframes rainfall{to{background-position:-32px 120px}}
.w-wind{background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.16) 60px 110px,transparent 110px 170px);background-size:340px 100%;
  -webkit-mask:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 26px);mask:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 26px);animation:windblow .8s linear infinite}
@keyframes windblow{to{background-position:340px 0}}
.w-fog{background:radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.3),transparent 60%),radial-gradient(ellipse at 75% 65%,rgba(255,255,255,.26),transparent 55%);animation:fogdrift 7s ease-in-out infinite alternate}
@keyframes fogdrift{to{transform:translateX(6%)}}
.w-storm{background:rgba(30,27,75,.32);animation:lightning 3.2s linear infinite}
@keyframes lightning{0%,88%,94%,100%{box-shadow:none;background:rgba(30,27,75,.32)}90%,96%{background:rgba(255,255,255,.35)}}
.handbar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"energy hand turn";align-items:end;gap:12px;padding-bottom:6px}
.energy{grid-area:energy;display:flex;flex-direction:column;align-items:center;gap:6px}
.orbs{display:flex;flex-direction:column-reverse;gap:6px}
.orb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.orb.on{background:radial-gradient(circle at 35% 30%,#fff7b0,var(--gold) 45%,#b89c00);box-shadow:0 0 12px rgba(251,225,34,.7)}
.energy span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.energy b{font:400 18px var(--font-display);color:var(--gold)}
.hand{grid-area:hand;display:flex;gap:10px;justify-content:flex-start;overflow-x:auto;padding:24px 18px 20px;margin:-10px -14px -16px;min-width:0}
.hand>:first-child{margin-left:auto}.hand>:last-child{margin-right:auto}
.hand .card{width:max(92px,min(clamp(104px,12.6vw,150px),calc((100% - (var(--n) - 1)*10px)/var(--n))))}
.turnbox{grid-area:turn;display:flex;flex-direction:column;align-items:center;gap:6px}
.turnbox small{font-size:12px;color:var(--muted);white-space:nowrap}
.endturn{min-height:70px;font:400 16px/1.1 var(--font-display);padding:12px 16px}

/* CARD */
.card{position:relative;flex:none;width:clamp(104px,12.6vw,150px);aspect-ratio:5/7.2;border:0;border-radius:14px;padding:0;overflow:clip;
  display:flex;flex-direction:column;text-align:center;background:#f6f3ea;color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 3px var(--kc);
  transition:transform .12s;--kc:var(--red)}
.card.k-def{--kc:#e9e9e9}
.card.k-skill{--kc:var(--gold)}
.card:active{transform:translateY(-6px) scale(.97)}
.card.cant{filter:grayscale(.8) brightness(.7)}
.card .top{background:var(--red);color:#fff;padding:6px 6px 22px;position:relative}
.card.k-def .top{background:#1c1c1c}
.card.k-skill .top{background:#1c1c1c;color:var(--gold)}
.card .pname{font:400 clamp(10px,1.15vw,13px)/1.22 var(--font-display);margin-block:-.06em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:20px}
.card .cost{position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ink);font:400 15px/26px var(--font-display);box-shadow:0 2px 0 #9c8a00}
.card .num{position:absolute;right:6px;top:5px;font:400 12px var(--font-display);opacity:.85}
.card .art{width:52%;margin:-18px auto 0;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--kc),0 4px 8px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--red);position:relative}
.card.k-def .art{color:#1c1c1c}
.card.k-skill .art{color:#b08f00}
.card.k-gear{--kc:#38bdf8}
.card.k-gear .top{background:#0c4a6e;color:#e0f2fe}
.card.k-gear .art{color:#0369a1}
.card.k-env{--kc:#34d399}
.card.k-env .top{background:#064e3b;color:#d1fae5}
.card.k-env .art{color:#047857}
.card .art svg{width:66%;height:66%}
.card .cname{font:900 clamp(13px,1.35vw,16px)/1.1 var(--font-body);margin-top:6px;padding-inline:4px}
.card .ctext{font:800 clamp(11px,1.1vw,13px)/1.2 var(--font-body);padding:3px 6px;color:#333;flex:1}
.card .ctier{font:900 11px var(--font-body);text-transform:uppercase;letter-spacing:.05em;padding:5px;background:rgba(0,0,0,.06)}
.card .ctier i{font-style:normal;color:var(--red)}
.card.big{width:clamp(150px,22vw,200px)}
.card.big .pname{font-size:15px}
.card.big .cname{font-size:19px}
.card.big .ctext{font-size:15px}
.offer{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding-block:10px}
.rtag{position:relative;inset:auto;max-width:none;align-self:center;margin:0 auto 4px;box-sizing:content-box;width:max-content;white-space:nowrap;font:900 10px var(--font-body);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:#ddd;color:#333}
.rtag.rare{background:var(--tiotal);color:#00334a}
.rtag.epic{background:var(--hundratal);color:#4a0030}

/* EPISKA KORT: lila holo-ram som pulserar, glansstrimma och gnistor */
@property --holo{syntax:'<angle>';inherits:false;initial-value:0deg}
.card.r-epic{--kc:#b93cf6;border:3px solid transparent;
  background:linear-gradient(180deg,#f8f3ff 0%,#f6f3ea 45%,#efe2ff 100%) padding-box,
    conic-gradient(from var(--holo),#a855f7,#ec4899,#22d3ee,#a855f7,#f0abfc,#a855f7) border-box;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 18px 2px rgba(185,60,246,.55);animation:holo 4s linear infinite,epicGlow 2.2s ease-in-out infinite}
@keyframes holo{to{--holo:360deg}}
@keyframes epicGlow{50%{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 30px 7px rgba(236,72,153,.75)}}
.card.r-epic .top{box-shadow:inset 0 -4px 0 #b93cf6}
.card.r-epic .art{box-shadow:0 0 0 3px #b93cf6,0 0 16px 3px rgba(185,60,246,.65)}
.card.r-epic .ctier{background:linear-gradient(90deg,#ead5ff,#fbd5f0);color:#4c1d95}
.card.r-epic::after,.card.r-legend::after{content:"";position:absolute;inset:-10%;pointer-events:none;z-index:3;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.65) 47%,rgba(255,190,255,.35) 52%,transparent 64%);
  transform:translateX(-110%);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,35%{transform:translateX(-110%)}75%,100%{transform:translateX(110%)}}
.rtag.epic{background:linear-gradient(90deg,#a855f7,#ec4899);color:#fff;box-shadow:0 0 10px rgba(236,72,153,.6)}
.card .spark{position:absolute;z-index:4;width:12px;height:12px;pointer-events:none;
  background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 1.8s ease-in-out infinite}
.card .spark.s1{top:31%;left:9%}.card .spark.s2{top:17%;right:9%;animation-delay:.6s;width:10px;height:10px}.card .spark.s3{top:43%;right:11%;animation-delay:1.2s}
.card.r-epic .spark{background:#c026d3;width:14px;height:14px;filter:drop-shadow(0 0 3px #f0abfc)}
.card.r-epic .spark.s2{width:11px;height:11px}
@keyframes twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}

/* LEGENDARISKA KORT: svart och guld, solstrålar, folie och stort tröjnummer */
.card.r-legend{--kc:#f5c542;border:3px solid transparent;color:#ffe9a8;
  background:radial-gradient(120% 85% at 50% 18%,#4a3608 0%,#1d1503 55%,#0b0803 100%) padding-box,
    conic-gradient(from var(--holo),#fff3b0,#f5c542,#b8860b,#fff8d6,#f59e0b,#fde68a,#fff3b0) border-box;
  box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 22px 4px rgba(245,197,66,.6);animation:holo 3s linear infinite,legendGlow 1.8s ease-in-out infinite}
@keyframes legendGlow{50%{box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 36px 10px rgba(255,214,90,.85)}}
.card.r-legend::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(125deg,#ff4d4d 0 6%,#ffd84d 6% 12%,#5eff8a 12% 18%,#4dd8ff 18% 24%,#b36bff 24% 30%);background-size:220% 220%;
  mix-blend-mode:overlay;animation:foil 6s linear infinite}
@keyframes foil{to{background-position:220% 0}}
.card.r-legend .top{background:linear-gradient(90deg,#0b0803,#6b4a00 50%,#0b0803);color:#ffd75e;box-shadow:inset 0 -3px 0 #f5c542}
.card.r-legend .pname{text-shadow:0 0 8px rgba(255,200,60,.8)}
.card.r-legend .num{color:#ffd75e;opacity:1}
.card.r-legend .art{isolation:isolate;color:#3a2600;background:radial-gradient(circle at 35% 30%,#fffbe0,#f5c542 55%,#a87200);
  box-shadow:0 0 0 3px #fff3b0,0 0 20px 6px rgba(255,200,60,.75)}
.card.r-legend .art::before{content:"";position:absolute;inset:-32%;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(rgba(255,226,120,.38) 0 7deg,transparent 7deg 18deg);animation:spin 12s linear infinite}
.card.r-legend .cname{color:#ffd75e;text-shadow:0 2px 0 #000}
.card.r-legend .ctext{color:#f5e6c0}
.card.r-legend .ctier{background:linear-gradient(90deg,#3a2a05,#6b4a00,#3a2a05);color:#ffe9a8}
.card.r-legend .ctier i{color:#ffd75e}
.card.r-legend .bignum{position:absolute;right:-4%;bottom:6%;font:400 4.2em/1 var(--font-display);color:rgba(255,215,90,.10);pointer-events:none}
.card.r-legend .spark{background:#fff3b0}
.rtag.legend{background:linear-gradient(90deg,#f5c542,#fff3b0,#f5c542,#ffd75e,#f5c542);background-size:200% 100%;color:#1d1503;z-index:2;
  box-shadow:0 0 12px rgba(255,214,90,.9);animation:foil 2.5s linear infinite}
.card.r-epic,.card.r-legend{isolation:isolate}
/* på handen ligger korten i en rullbar ruta – mindre glöd så att den inte klipps */
.hand .card.r-epic{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 10px 2px rgba(185,60,246,.55);animation:holo 4s linear infinite,epicGlowS 2.2s ease-in-out infinite}
.hand .card.r-legend{box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 12px 3px rgba(245,197,66,.65);animation:holo 3s linear infinite,legendGlowS 1.8s ease-in-out infinite}
@keyframes epicGlowS{50%{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 16px 4px rgba(236,72,153,.75)}}
@keyframes legendGlowS{50%{box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 18px 6px rgba(255,214,90,.85)}}
.hand .card.r-legend.cant,.hand .card.r-epic.cant{animation:none}
.card.r-legend.cant,.card.r-epic.cant{animation:none}
.legendstat b{color:#ffd75e;text-shadow:0 0 12px rgba(255,200,60,.7)}
.legendcall{font:400 clamp(20px,3vw,30px)/1.2 var(--font-display);color:#ffd75e;text-shadow:0 0 18px rgba(255,200,60,.9);animation:pulse 1s infinite}
.legendban{position:fixed;left:0;right:0;top:38%;transform:translateY(-50%);text-align:center;pointer-events:none;z-index:90;animation:superban 1.8s forwards}
.legendban::before{content:"";position:absolute;inset:-22px -10px;background:linear-gradient(90deg,transparent,#3a2a05 12%,#b8860b 50%,#3a2a05 88%,transparent);transform:skewY(-3deg);box-shadow:0 0 50px rgba(255,200,60,.8)}
.legendban b{position:relative;display:block;font:400 clamp(40px,9vw,100px)/1 var(--font-display);color:#fff3b0;text-shadow:0 0 14px #f5c542,0 5px 0 #3a2a05}
.legendban span{position:relative;display:block;font:400 clamp(14px,2.2vw,22px) var(--font-display);color:#fff;margin-top:6px}

/* overlay panels */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:16px}
.panel{background:#0d1512;border-radius:22px;padding:24px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;
  box-shadow:0 0 0 3px var(--gold),0 20px 50px rgba(0,0,0,.6)}
.panel h2{font:400 clamp(26px,4vw,40px)/1.22 var(--font-display)}
.pens{display:grid;gap:8px;width:100%}
.penrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px}
.dots{display:flex;gap:6px}
.dot{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15)}
.dot.y{background:var(--good)}.dot.n{background:var(--red)}

/* MODAL / PROBLEM */
#modal{position:fixed;inset:0;z-index:50;background:rgba(3,8,6,.86);display:grid;place-items:center;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.pm{width:min(1040px,100%);background:var(--board);border-radius:24px;box-shadow:0 0 0 4px #3a4a43,0 30px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:14px 14px}
.pm-head{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(0,0,0,.35)}
.pm-head h2{font:400 clamp(18px,2.6vw,26px)/1.22 var(--font-display)}
.pm-head .grow{flex:1;min-width:0}
.tierchip{font:400 12px var(--font-display);padding:6px 10px;border-radius:99px;background:var(--gold);color:var(--ink);white-space:nowrap}
.clockwrap{display:flex;align-items:center;gap:10px;padding:8px 18px 0;font-size:13px;color:var(--muted)}
.clk{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.clk i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold));transform-origin:left}
.clockwrap .late{display:none}
.clockwrap.out .early{display:none}
.clockwrap.out .late{display:inline}
.pm-body{display:grid;grid-template-columns:1fr minmax(250px,320px);gap:18px;padding:18px}
.boardcol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0}
.qpart{display:contents}
.msg{min-height:1.4em;text-align:center;font-size:17px;color:var(--warn)}
.tip{background:rgba(111,211,255,.12);border-radius:12px;padding:10px 14px;font-size:17px;max-width:46ch;color:var(--chalk);box-shadow:inset 0 0 0 2px rgba(111,211,255,.35)}
.grid{display:grid;grid-template-columns:repeat(calc(var(--w) + 1),1.2em);justify-content:center;font:900 clamp(44px,8vmin,80px)/1 var(--font-body);
  font-variant-numeric:tabular-nums}
.grid>*{display:grid;place-items:center;height:1.15em}
.grid .lab{font:400 .26em/1 var(--font-display);height:1.6em;align-self:end}
.grid .lab.c0{color:var(--ental)}.grid .lab.c1{color:var(--tiotal)}.grid .lab.c2{color:var(--hundratal)}
.grid .c0{background:rgba(255,216,77,.07)}.grid .c1{background:rgba(111,211,255,.07)}.grid .c2{background:rgba(255,154,213,.07)}
.grid .lab.hl,.grid .hl{background:rgba(255,255,255,.16)}
.grid .carry{font-size:.5em;height:2.1em;color:var(--red);font-weight:900}
.grid button.carry{border:0;background:transparent;width:100%;height:2.1em;font-size:.5em;color:#ff6b5e;font-weight:900}
.grid button.carry::before{content:"";position:absolute}
.grid button.carry:not(.on){outline:2px dashed rgba(255,255,255,.22);outline-offset:-6px;border-radius:12px}
.grid .carry.on{color:#ff6b5e;text-shadow:0 0 8px rgba(255,107,94,.6)}
.grid .op{color:var(--chalk)}
.grid .rule{grid-column:1/-1;height:.07em;background:var(--chalk);border-radius:2px;margin-block:.08em}
.grid button.dig{border:0;background:transparent;font:inherit;color:inherit;width:100%;height:1.15em;padding:0}
.grid .dig.top{text-decoration:underline dotted rgba(255,255,255,.35);text-underline-offset:.12em;text-decoration-thickness:.04em}
.grid .struck{position:relative;color:rgba(244,242,234,.45)}
.grid .struck::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:.07em;background:#ff6b5e;transform:rotate(-20deg)}
.grid .ans{width:100%;height:1.25em;border:0;background:transparent;font:inherit;color:var(--chalk);position:relative;padding:0}
.grid button.ans::after{content:"";position:absolute;left:12%;right:12%;bottom:.06em;height:.06em;border-radius:3px;background:rgba(255,255,255,.35)}
.grid button.ans.c0::after{background:var(--ental)}.grid button.ans.c1::after{background:var(--tiotal)}.grid button.ans.c2::after{background:var(--hundratal)}
.grid button.ans.cur{background:rgba(251,225,34,.18);border-radius:.12em;box-shadow:inset 0 0 0 .05em var(--gold)}
.grid div.ans.fill{animation:pop .3s}
.grid.long{font-size:clamp(36px,6.2vmin,64px)}
@keyframes pop{0%{transform:scale(.4);opacity:0}}
.padcol{display:flex;flex-direction:column;gap:10px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.numpad button{border:0;border-radius:16px;min-height:66px;background:#2c3b35;font:900 32px var(--font-body);box-shadow:0 5px 0 #121a17}
.numpad button:active{transform:translateY(3px);box-shadow:0 2px 0 #121a17}
.numpad .fn{font-size:17px;background:#24302b}
.numpad .fn.tipbtn{color:var(--tiotal)}
.submit{min-height:76px;font:400 26px var(--font-display)}
.small-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:52ch;width:100%}
.steps li{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;font-size:17px;border-left:6px solid var(--sc,#888)}
.steps li.now{background:rgba(255,255,255,.14)}
.steps li.s0{--sc:var(--ental)}.steps li.s1{--sc:var(--tiotal)}.steps li.s2{--sc:var(--hundratal)}
.solhead{font:400 clamp(20px,3vw,28px) var(--font-display);color:var(--gold);text-align:center}
.right-burst{font:400 clamp(60px,12vw,120px)/1.22 var(--font-display);margin:-.11em 0;color:var(--good);text-shadow:0 6px 0 rgba(0,0,0,.4);animation:pop .35s}
.solpanel{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:18px;align-items:start}
.solpanel .steps{max-width:none}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.float{position:fixed;transform:translate(-50%,-50%);font:400 22px var(--font-display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6);white-space:nowrap;animation:floatup 1.3s forwards}
.float.gold{color:var(--gold)}.float.red{color:#ff7a6e}.float.blue{color:var(--tiotal)}.float.green{color:var(--good)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-200%)}}
.banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;animation:banner 1.8s forwards}
.banner b{display:block;font:400 clamp(70px,15vw,170px)/1.22 var(--font-display);margin:-.16em 0;color:var(--gold);-webkit-text-stroke:3px var(--red);text-shadow:0 10px 0 rgba(0,0,0,.45)}
.banner span{font:400 clamp(18px,3vw,28px) var(--font-display);color:#fff}
.banner.sad b{color:#fff;-webkit-text-stroke:3px var(--opp,#555);font-size:clamp(40px,8vw,90px)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
#confetti{position:fixed;inset:0;width:100%;height:100%}
.superban{position:fixed;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;pointer-events:none;animation:superban 1.9s forwards;z-index:90}
.superban::before{content:"";position:absolute;inset:-26px -10px;background:linear-gradient(90deg,transparent,#c2140a 12%,#ff5a1f 50%,#c2140a 88%,transparent);transform:skewY(-4deg);box-shadow:0 0 60px rgba(255,90,31,.8)}
.superban::after{content:"";position:absolute;inset:-26px -10px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 6px,transparent 6px 26px);transform:skewY(-4deg);animation:sbstripes .5s linear infinite}
.superban b{position:relative;display:block;font:400 clamp(54px,11vw,130px)/.95 var(--font-display);color:#fff7cc;letter-spacing:.02em;
  text-shadow:0 0 12px #ffd84d,0 0 36px #ff5a1f,0 6px 0 #5a0700;animation:sbshake .12s 8}
.superban span{position:relative;display:block;font:400 clamp(16px,2.6vw,26px) var(--font-display);color:#fff;margin-top:6px}
@keyframes superban{0%{opacity:0;transform:translateY(-50%) scaleX(2.4) scaleY(.4)}10%{opacity:1;transform:translateY(-50%) scale(1.05)}18%{transform:translateY(-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-50%) scale(1.25)}}
@keyframes sbstripes{to{background-position:52px 0}}
@keyframes sbshake{25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,1px)}}
.flash{position:fixed;inset:0;background:#fff;animation:flash .5s forwards;z-index:89;pointer-events:none}
.flash.hot{background:radial-gradient(circle at 30% 50%,#fff7cc,#ff8a1f 45%,rgba(255,40,0,0) 75%)}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.pitch.danger{animation:danger 1.1s ease-in-out infinite}
@keyframes danger{50%{box-shadow:inset 0 0 0 3px #ff5a1f,0 0 0 3px #ff5a1f,0 0 36px rgba(255,90,31,.75)}}
.intent.super{box-shadow:inset 0 0 0 2px #ff5a1f,0 0 24px rgba(255,90,31,.7);animation:pulse .9s infinite}
.intent.super .eyebrow{color:#ffb38a}
#app.bigshake{animation:bigshake .7s}
@keyframes bigshake{10%{transform:translate(-14px,6px)}20%{transform:translate(12px,-8px)}30%{transform:translate(-10px,4px)}45%{transform:translate(8px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-1px)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;border-radius:12px;padding:10px 16px;font-weight:900;box-shadow:0 0 0 2px var(--gold);animation:floatup 1.8s forwards}

/* info pages */
.prose{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.prose h3{font:400 20px var(--font-display);color:var(--gold);margin-top:8px}
.prose p,.prose li{font-size:17px;max-width:65ch}
.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.method{background:rgba(0,0,0,.4);border-radius:14px;padding:14px 16px}
.method b{display:block;font-size:17px;color:var(--chalk)}
.method p{color:var(--muted);font-size:15px;margin-top:4px}
.skilltable{width:100%;border-collapse:collapse;font-size:15px}
.skilltable th,.skilltable td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
.skilltable .n{text-align:right;font-variant-numeric:tabular-nums}
.mast{display:flex;gap:3px}
.mast i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.15)}
.mast i.on{background:var(--good)}
.tablewrap{overflow-x:auto}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.level{border:0;text-align:left;background:rgba(0,0,0,.45);border-radius:16px;padding:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);display:flex;flex-direction:column;gap:6px}
.level b{font:400 20px var(--font-display);color:var(--gold)}
.level span{font-size:15px;color:var(--muted)}
.trophy{width:min(200px,40vw);filter:drop-shadow(0 10px 30px rgba(251,225,34,.45))}

/* uppgifter: text, figurer, svarsfält, flerval */
.grid .lab.c3{color:#9ff0b0}.grid .lab.c4{color:#c4a7ff}
.grid .c3{background:rgba(159,240,176,.07)}.grid .c4{background:rgba(196,167,255,.07)}
.grid button.ans.c3::after{background:#9ff0b0}.grid button.ans.c4::after{background:#c4a7ff}
.qtext{font-size:clamp(20px,2.6vw,26px);line-height:1.35;text-align:center;max-width:32ch;text-wrap:balance}
.qtext b{color:var(--gold);font-weight:900;white-space:nowrap}
.calc{font-size:14px;color:var(--tiotal);background:rgba(111,211,255,.12);border-radius:99px;padding:4px 12px}
.qfigwrap{width:100%;display:flex;justify-content:center;overflow-x:auto}
.qfig{width:100%;max-width:400px;max-height:min(300px,40vh);height:auto}
.qtable{border-collapse:collapse;font-size:18px;font-variant-numeric:tabular-nums;color:var(--chalk)}
.qtable th,.qtable td{border:2px solid rgba(244,242,234,.35);padding:6px 12px;text-align:center}
.qtable tr:first-child th{color:var(--gold)}
.qtable th[scope=row]{text-align:left;color:var(--tiotal)}
.fields{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font:900 clamp(30px,5vmin,44px)/1 var(--font-body)}
.fl{display:flex;align-items:center;gap:8px}
.flab{font-size:.5em;color:var(--muted)}
.fsuf{font-size:.6em;color:var(--chalk)}
.sep{color:var(--chalk)}
.fld{min-width:2.6em;height:1.5em;padding:0 .25em;border:0;border-radius:.2em;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 .06em rgba(244,242,234,.4);
  font:inherit;color:var(--chalk);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.fld.cur{box-shadow:inset 0 0 0 .08em var(--gold),0 0 18px rgba(251,225,34,.35);background:rgba(251,225,34,.12)}
.frbox{display:inline-flex;flex-direction:column;align-items:center;gap:.12em}
.frbox .fld{min-width:2em}
.frbar{display:block;width:100%;height:.08em;background:var(--chalk);border-radius:2px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em}
.fr i{font-style:normal}
.fr i:first-child{border-bottom:.08em solid currentColor;padding:0 .15em .05em}
.fr i:last-child{padding-top:.05em}
.pm-body.one{grid-template-columns:1fr;justify-items:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(640px,100%)}
.choice{border:0;border-radius:16px;min-height:72px;padding:12px;background:#2c3b35;box-shadow:0 5px 0 #121a17;font:900 clamp(20px,2.6vw,26px)/1.2 var(--font-body);color:var(--chalk)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #121a17}
.numpad span{display:block}
.unlock{background:rgba(94,224,138,.15);box-shadow:inset 0 0 0 2px var(--good);border-radius:14px;padding:12px 16px;font-size:18px}
/* ligor */
.leagues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.league.wc{grid-column:1/-1}
.league{border-radius:20px;overflow:hidden;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);display:flex;flex-direction:column;min-width:0}
.league header{background:linear-gradient(135deg,var(--lc),rgba(0,0,0,.6));padding:16px;border-bottom:4px solid var(--la)}
.league header h3{font:400 clamp(20px,2.4vw,26px)/1.22 var(--font-display)}
.league header .eyebrow{color:var(--la)}
.lvls{display:flex;flex-direction:column;gap:10px;padding:14px}
.lvl{border:0;text-align:left;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);display:flex;flex-direction:column;gap:4px;color:var(--chalk)}
.lvl.won{box-shadow:inset 0 0 0 2px var(--gold)}
.lvl.locked{opacity:.45}
.lvtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvtop b{font:400 18px var(--font-display);color:var(--la)}
.lvrange{font-size:13px;color:var(--muted);white-space:nowrap}
.lvtopics{font-size:14px;color:var(--muted);font-weight:700}
.lvstate{font-size:14px;font-weight:900}
.lvl.won .lvstate{color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;border-radius:99px;padding:10px 16px;min-height:44px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);font-weight:900;color:var(--chalk)}
.tab small{opacity:.7;font-weight:800}
.tab.on{background:var(--gold);color:var(--ink);box-shadow:none}
.panelbox h3{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.sec{border:0;text-align:left;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.06);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"code name" "code mast";column-gap:10px;row-gap:4px;color:var(--chalk);min-height:56px}
.sec .scode{grid-area:code;font:400 14px var(--font-display);color:var(--gold);align-self:center;white-space:nowrap}
.sec .sname{grid-area:name;font-weight:800;font-size:15px;line-height:1.2}
.sec .mast{grid-area:mast}
details.rep{background:rgba(0,0,0,.35);border-radius:14px;padding:10px 14px}
details.rep summary{font:400 17px var(--font-display);color:var(--gold);cursor:pointer;padding:4px 0}
.panelbox h3 small{font:800 13px var(--font-body);color:var(--muted)}
.libcards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding-block:4px}
.card.unknown{display:grid;place-items:center;background:repeating-linear-gradient(135deg,#1d2723 0 10px,#18211d 10px 20px);box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.12)}
.card.unknown span{font:400 54px/1 var(--font-display);color:rgba(255,255,255,.22)}
.libteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;align-items:start}
.libteam{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.libteam summary,.libteam.unknown{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;min-height:34px}
.libteam summary::-webkit-details-marker{display:none}
.libteam[open]{box-shadow:inset 0 0 0 2px var(--opp)}
.libteam.unknown{color:var(--muted);cursor:default}
.libteam.unknown .oppbadge{background:rgba(255,255,255,.1);color:var(--muted);font-size:16px}
.libteam ol{list-style:none;margin:10px 0 4px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:14px}
.libteam li span{display:inline-block;min-width:2em;color:var(--gold);font-weight:900;font-variant-numeric:tabular-nums}
.librelics .level{cursor:default}
.libicon{width:44px;height:44px;display:grid;place-items:center;color:var(--gold);font:400 30px var(--font-display)}
.level.unknown{opacity:.55}
.level.unknown .libicon{color:var(--muted)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.trophy{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:16px;
  text-align:center;color:var(--muted);background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.trophy .ticon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);font:400 28px var(--font-display)}
.trophy .ticon svg{width:30px;height:30px}
.trophy b{font:400 16px/1.25 var(--font-display);color:var(--chalk)}
.trophy .ttext{font-size:14px;line-height:1.3}
.tbar{width:80%;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:2px}
.tbar i{display:block;height:100%;border-radius:4px;background:var(--gold)}
.tprog{font-size:12px;font-variant-numeric:tabular-nums}
.trophy.on{color:#f5e6c0;background:linear-gradient(160deg,rgba(245,197,66,.2),rgba(0,0,0,.45));box-shadow:inset 0 0 0 2px rgba(245,197,66,.6)}
.trophy.on .ticon{color:#3a2600;background:radial-gradient(circle at 35% 30%,#fffbe0,#f5c542 55%,#a87200);box-shadow:0 0 16px rgba(255,214,90,.5)}
.trophy.on b{color:var(--gold)}
.trophy.secret:not(.on){box-shadow:inset 0 0 0 2px rgba(192,38,211,.35)}
.trophy.secret:not(.on) .ticon{color:rgba(240,171,252,.5);background:rgba(192,38,211,.12)}
.trophy.secret.on{color:#f5d0fe;background:linear-gradient(140deg,#1a0b2e,#4a0f6b 55%,#14061f);box-shadow:inset 0 0 0 2px #e879f9,0 0 22px rgba(192,38,211,.55)}
.trophy.secret.on .ticon{color:#1a0b2e;background:conic-gradient(from var(--holo,0deg),#ffd75e,#f472b6,#a78bfa,#67e8f9,#ffd75e);animation:holo 4s linear infinite;box-shadow:0 0 20px rgba(232,121,249,.8)}
.trophy.secret.on b{color:#ffd75e;text-shadow:0 0 10px rgba(232,121,249,.9)}
.trophy.secret.on::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);animation:sheen 3.5s ease-in-out infinite}
.trophyban{position:fixed;left:50%;top:12%;z-index:90;display:flex;align-items:center;gap:12px;padding:12px 22px 12px 14px;border-radius:18px;pointer-events:none;
  background:#16110a;box-shadow:0 0 0 3px #f5c542,0 14px 34px rgba(0,0,0,.6);animation:trophyIn 2.6s forwards}
.trophyban .ticon{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:#3a2600;background:radial-gradient(circle at 35% 30%,#fffbe0,#f5c542 55%,#a87200)}
.trophyban .ticon svg{width:28px;height:28px}
.trophyban small{display:block;font:800 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#f5e6c0}
.trophyban b{font:400 20px/1.22 var(--font-display);color:var(--gold)}
.trophyban.secret{background:linear-gradient(140deg,#1a0b2e,#4a0f6b);box-shadow:0 0 0 3px #e879f9,0 0 34px rgba(192,38,211,.75)}
.trophyban.secret .ticon{background:conic-gradient(#ffd75e,#f472b6,#a78bfa,#67e8f9,#ffd75e)}
@keyframes trophyIn{0%{opacity:0;transform:translate(-50%,-24px) scale(.9)}10%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-12px)}}

@media (max-width:820px){
  .path{grid-template-columns:repeat(3,1fr)}
  .leagues{grid-template-columns:1fr}
}
@media (max-width:760px){
  .pm-body{grid-template-columns:1fr}
  .solpanel{grid-template-columns:1fr}
  .handbar{grid-template-columns:auto 1fr;grid-template-areas:"energy turn" "hand hand"}
  .energy{flex-direction:row}
  .orbs{flex-direction:row}
  .turnbox{flex-direction:row;justify-self:end}
  .scoreboard{grid-template-columns:1fr auto 1fr;}
  .clockbox{grid-column:1/-1;text-align:center}
  .meters{grid-template-columns:1fr}
}
@media (max-height:700px) and (orientation:landscape){
  .grid{font-size:clamp(38px,7vmin,60px)}
  .numpad button{min-height:54px}
  .submit{min-height:60px}
}
/* VS: kompismatch online */
.vsinput{width:100%;font:800 20px var(--font-body);padding:12px 14px;border-radius:12px;border:0;background:rgba(0,0,0,.45);color:var(--chalk);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);-webkit-user-select:text;user-select:text}
.vsinput:focus{outline:none;box-shadow:inset 0 0 0 3px var(--gold)}
.vsinput::placeholder{color:rgba(244,242,234,.4)}
.vscode-in{font:400 30px var(--font-display);letter-spacing:.3em;text-align:center;text-transform:uppercase}
.vsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.vsgrid .panelbox .btn.big{width:100%}
.kits{display:flex;gap:8px;flex-wrap:wrap}
.chip.kit{display:flex;align-items:center;gap:8px}
.chip.kit i,.kitdot{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--kc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.chip.on{background:var(--gold);color:var(--ink);box-shadow:none}
.bigcode{display:flex;gap:10px;justify-content:center}
.bigcode span{width:min(19vw,92px);aspect-ratio:3/4;display:grid;place-items:center;background:#0b0f16;border-radius:14px;font:400 clamp(38px,9vw,66px)/1 var(--font-display);color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold)}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.vserr{background:rgba(218,41,28,.2);box-shadow:inset 0 0 0 2px var(--red);border-radius:12px;padding:10px 14px;font-size:16px}
.vsvs{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.vsvs .who{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:120px}
.vsvs .who b{font:400 clamp(18px,2.6vw,26px)/1.25 var(--font-display)}
.vsvs .who small{font-size:13px;color:var(--muted)}
.vsvs .kitdot{width:30px;height:30px}
.vsmark{font:400 clamp(26px,4vw,40px)/1 var(--font-display);color:var(--gold)}
.wall.atk{left:10px;bottom:10px;box-shadow:inset 0 0 0 3px var(--gold)}
#vsOpp{display:flex;flex-direction:column;gap:4px}
#vsOpp .eyebrow{margin:0}
.vsstate{font:900 16px var(--font-body);color:#fff}
.vsstate.ok{color:#8dffad}
.status .chip{min-height:32px;padding:4px 12px;font-size:13px}
.pickwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.pickwrap .role{font:400 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--gold);border-radius:99px;padding:4px 10px}
.minihand{grid-area:auto;padding:4px 0;margin:0;justify-content:center;flex-wrap:wrap;overflow:visible}
.minihand>:first-child,.minihand>:last-child{margin:0}
.minihand .card{width:clamp(92px,11vw,124px)}
.vsgrid.reveal{width:100%;max-width:980px}
/* ===== Mobil (iPhone/Android). iPad påverkas inte: minsta iPad är 744 px bred och 744 px hög. ===== */
@media (max-width:540px), (max-height:500px) and (orientation:landscape){
  #app{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .wrap{padding-block:12px 22px;gap:14px}
  .legend{display:none}
  .status:empty{display:none}
  .status{min-height:0}
  .tag{font-size:12px;padding:3px 10px}
  .turnbox small{display:none}
  /* planens rutor */
  .wall{padding:3px 8px;gap:6px;border-radius:10px}
  .wall b{font-size:16px}
  .wall span{font-size:9px}
  .wall.mine{left:6px;top:6px}.wall.theirs{right:6px;bottom:6px}.wall.atk{left:6px;bottom:6px}
  .wall i{font-size:0}
  .wall i::before{content:"i";font:900 11px/1 var(--font-body)}
  .vsstate{font-size:13px}
  .bigcode span{width:min(18vw,70px)}
  .intent{top:6px;right:6px;padding:5px 9px;gap:2px;border-radius:10px;max-width:62%}
  .intent .eyebrow{font-size:9px;margin:0}
  .ivals{font-size:17px;gap:8px}.ivals svg{width:18px;height:18px}
  .ihint{font-size:11px}
  /* mätare */
  .meters{grid-template-columns:1fr 1fr;gap:6px}
  .meter{padding:5px 9px;border-radius:10px}
  .mlabel{font-size:12px;margin-bottom:4px}
  .mlabel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .bar{height:9px}
  .mlabel b{white-space:nowrap}
  /* energi och turknapp */
  .handbar{grid-template-columns:auto 1fr;grid-template-areas:"energy turn" "hand hand";gap:6px;align-items:center;padding-bottom:4px}
  .energy{flex-direction:row;gap:6px}
  .orbs{flex-direction:row;gap:5px}
  .orb{width:22px;height:22px}
  .turnbox{flex-direction:row;justify-self:end}
  .endturn{min-height:42px;font-size:14px;padding:8px 16px}
  .endturn br{display:none}
  /* belöningskort: taggen i flödet så den inte täcker texten */
  .card .rtag{position:static;transform:none;align-self:center;margin:0 auto 4px}
  .hand .card .rtag{display:none}
  /* uppgiftsrutan */
  #modal{display:flex;flex-direction:column;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .pm{margin:auto;border-radius:18px;max-height:100%}
  .pm-body{flex:1 1 auto;min-height:0}
  .pm-body>.boardcol{min-height:0;overflow-y:auto;justify-content:flex-start}
  .pm-body>.boardcol>:first-child{margin-top:auto}
  .pm-body>.boardcol>:last-child{margin-bottom:auto}
  .pm-body>.boardcol>*{flex-shrink:0}
  .pm-body>.boardcol>.qpart{display:flex;flex-direction:column;align-items:center;gap:inherit;width:100%;min-height:0;flex-shrink:1;overflow-y:auto}
  .qpart>*{flex-shrink:0}
  .msg:empty{display:none}
  .pm-head .eyebrow{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
  .pm-head .btn{min-height:38px;padding:6px 14px;font-size:15px}
  .tierchip{font-size:10px;padding:5px 9px}
  .clockwrap{padding:6px 12px 0}
  .numpad{gap:8px;grid-template-columns:repeat(5,minmax(0,1fr))}
  .numpad button{border-radius:13px;box-shadow:0 4px 0 #121a17}
  .numpad .fn{order:1}
  .numpad span{display:none}
  .padcol{gap:8px}
  .steps li{font-size:15px;padding:8px 12px}
  .infobox .ib{padding:16px 18px;gap:8px}
  .infobox h4{font-size:20px}
  .infobox p{font-size:15px}
  .panel{padding:16px;gap:10px;border-radius:18px}
  .panel h2{font-size:24px}
  /* straffar */
  .penview{grid-template-columns:minmax(0,1fr);border-radius:12px}
  .penfoot p{font-size:16px}
  .penfoot .btn.big{min-height:48px;padding:10px 14px;font-size:15px}
  .dot{width:14px;height:14px}.dots{gap:4px}
  .skilltable{font-size:13px}
}
/* telefon på höjden */
@media (max-width:540px){
  .match{gap:6px;padding-block:6px}
  .scoreboard{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;padding:6px 10px;border-radius:12px}
  .team{font-size:13px;gap:6px}
  .team .badge{font-size:28px}
  .oppbadge{width:28px;height:28px;font-size:9px}
  .score{font-size:28px;gap:6px}
  .clockbox{grid-column:1/-1;display:flex;justify-content:center;align-items:baseline;gap:8px;padding:3px 8px;font-size:11px}
  .clockbox small{display:inline;font-size:11px}
  .field{gap:6px}
  .pitch{border-radius:12px;min-height:180px}
  /* fem kort i en rad som får plats på bredden */
  .hand{gap:6px;padding:16px 10px 14px;margin:-8px -10px -10px;overflow-x:auto}
  .hand .card{width:max(58px,calc((100% - (var(--n) - 1) * 6px) / var(--n)));aspect-ratio:5/7.4;border-radius:10px;box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 2px var(--kc)}
  .hand .card .top{padding:4px 3px 13px}
  .hand .card .pname{font-size:8.5px;padding:0 2px 0 17px}
  .hand .card .cost{width:18px;height:18px;left:2px;top:2px;font:400 11px/18px var(--font-display)}
  .hand .card .num{display:none}
  .hand .card .art{width:46%;margin-top:-10px;box-shadow:0 0 0 2px var(--kc)}
  .hand .card .cname{font-size:11px;margin-top:3px;padding-inline:2px}
  .hand .card .ctext{font-size:9px;padding:2px 3px;line-height:1.15}
  .hand .card .ctier{font-size:8px;padding:3px 2px;letter-spacing:.02em}
  .hand .card .ctier i{display:none}
  /* uppgiftsrutan: knappar överst, rubriken på egen rad */
  #modal{padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
  .pm-head{flex-wrap:wrap;padding:8px 12px;gap:6px 10px}
  .pm-head .grow{order:2;flex-basis:100%}
  .pm-head .tierchip{margin-right:auto}
  .pm-head h2{font-size:18px}
  .pm-body{padding:8px 12px 10px;gap:8px;grid-template-rows:minmax(0,1fr) auto}
  .pm-body.one{grid-template-rows:minmax(0,1fr) auto auto}
  .numpad button{min-height:44px;font-size:26px}
  .submit{min-height:52px;font-size:22px}
  .grid{font-size:min(9.5vw,52px)}
  .grid.long{font-size:min(7.5vw,42px)}
  .qtext{font-size:19px}
  .qfig{max-height:22vh}
  .fields{font-size:34px}
  .tip{font-size:15px;padding:8px 12px}
  .qtable{font-size:16px}
  .qtable th,.qtable td{padding:4px 10px}
  .choices{gap:8px}
  .choice{min-height:56px;font-size:19px}
  .solpanel{padding:12px;gap:12px}
  .btn.big{min-height:52px;padding:12px 18px;font-size:17px}
  .card.big{width:min(150px,calc(50% - 8px))}
  .offer{gap:14px}
  /* spegeldraften: tre kort bredvid varandra */
  .offer.draft{gap:8px;flex-wrap:nowrap}
  .offer.draft{padding-inline:6px}
  .offer .pickwrap{width:calc((100% - 16px) / 3);gap:6px}
  .pickwrap .role{font-size:9px;padding:3px 7px;letter-spacing:.03em;text-align:center}

let AC = null;
function ac(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
document.addEventListener('pointerdown', () => { if (save.settings.sound) ac(); });
function tone(f, t0, dur, type = 'sine', vol = .15, f2){
  const a = ac(); if (!a) return; const t = a.currentTime + t0;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, vol, freq){
  const a = ac(); if (!a) return; const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .7;
  const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}

    case 'pass':  tone(200, 0, .09, 'sine', .18, 80); break;

const BALL = (() => {
  const S = 256, R = S / 2 - 3, C = S / 2;
  const mk = () => { const cv = document.createElement('canvas'); cv.width = cv.height = S; return cv; };
  const pat = mk(), pc = pat.getContext('2d');
  pc.save(); pc.beginPath(); pc.arc(C, C, R, 0, 7); pc.clip();
  pc.fillStyle = '#fbfbf8'; pc.fillRect(0, 0, S, S);
  const poly = (x, y, r, rot, n = 5) => { pc.beginPath(); for (let k = 0; k < n; k++){ const a = rot + k * 2 * Math.PI / n; pc.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } pc.closePath(); };
  const inner = [], ring = [];
  for (let k = 0; k < 5; k++){
    const a = -Math.PI / 2 + k * 2 * Math.PI / 5;
    inner.push([C + Math.cos(a) * R * .27, C + Math.sin(a) * R * .27]);
    ring.push([C + Math.cos(a) * R * .56, C + Math.sin(a) * R * .56]);
  }
  pc.strokeStyle = '#a7adb5'; pc.lineWidth = 3; pc.lineJoin = 'round';
  for (let k = 0; k < 5; k++){
    const a = -Math.PI / 2 + k * 2 * Math.PI / 5, b = a + Math.PI / 5;
    pc.beginPath(); pc.moveTo(...inner[k]); pc.lineTo(...ring[k]); pc.stroke();
    const o = [C + Math.cos(b) * R * .9, C + Math.sin(b) * R * .9];
    pc.beginPath(); pc.moveTo(...ring[k]); pc.lineTo(C + Math.cos(b - .32) * R * .74, C + Math.sin(b - .32) * R * .74); pc.lineTo(...o); pc.stroke();
    pc.beginPath(); pc.moveTo(...ring[(k + 1) % 5]); pc.lineTo(C + Math.cos(b + .32) * R * .74, C + Math.sin(b + .32) * R * .74); pc.lineTo(...o); pc.stroke();
    pc.beginPath(); pc.moveTo(...ring[k]); pc.lineTo(C + Math.cos(a) * R * 1.1, C + Math.sin(a) * R * 1.1); pc.stroke();
  }
  pc.fillStyle = '#15171c';
  poly(C, C, R * .27, -Math.PI / 2); pc.fill();
  for (let k = 0; k < 5; k++){
    const b = -Math.PI / 2 + k * 2 * Math.PI / 5 + Math.PI / 5;
    poly(C + Math.cos(b) * R * .98, C + Math.sin(b) * R * .98, R * .25, b + Math.PI); pc.fill();
  }
  pc.restore();
  const shade = mk(), sc = shade.getContext('2d');
  const g1 = sc.createRadialGradient(C - R * .35, C - R * .4, R * .1, C, C, R);
  g1.addColorStop(0, 'rgba(255,255,255,0)'); g1.addColorStop(.6, 'rgba(20,30,50,.06)'); g1.addColorStop(1, 'rgba(10,15,30,.55)');
  sc.fillStyle = g1; sc.beginPath(); sc.arc(C, C, R, 0, 7); sc.fill();
  const g2 = sc.createRadialGradient(C - R * .36, C - R * .42, 0, C - R * .36, C - R * .42, R * .42);
  g2.addColorStop(0, 'rgba(255,255,255,.9)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
  sc.fillStyle = g2; sc.beginPath(); sc.arc(C, C, R, 0, 7); sc.fill();
  sc.strokeStyle = 'rgba(0,0,0,.6)'; sc.lineWidth = 4; sc.beginPath(); sc.arc(C, C, R, 0, 7); sc.stroke();
  return { pat, shade, S };
})();
function paintBall(c, x, y, r, rot){
  if (r <= 0) return;
  c.save(); c.translate(x, y);
  c.save(); c.rotate(rot); c.drawImage(BALL.pat, -r, -r, r * 2, r * 2); c.restore();
  c.drawImage(BALL.shade, -r, -r, r * 2, r * 2);

}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const F = { cv:document.createElement('canvas'), W:0, H:0, dpr:1, us:[], them:[], ball:{ x:.5, y:.5, z:0, spin:0 }, holder:null,

}
function nearest(list, pt, filt = () => true){
  let best = null, bd = 1e9;
  list.forEach(p => { if (!filt(p)) return; const d = Math.hypot((p.x - pt.x) * 1.8, p.y - pt.y); if (d < bd){ bd = d; best = p; } });
  return best || list[list.length - 1];
}
function restPoint(){
  if (!M) return { x:.5, y:.5 };

function onPitch(c){

  const role = ROLE_OF[c.player] || (c.kind === 'def' ? 'D' : 'F');
  const cands = F.us.filter(q => q.role === role);
  p = pick(cands.length ? cands : F.us.filter(q => q.role !== 'G'));

const ST = {
  pass:  (to, o = {}) => ({ k:'pass', to, ...o }),
  carry: (p, to, dur = 550, o = {}) => ({ k:'carry', p, to, dur, ...o }),
  tackle:(p, victim, o = {}) => ({ k:'tackle', p, victim, dur:480, ...o }),
  wait:  (dur, o = {}) => ({ k:'wait', dur, ...o }),
  call:  fn => ({ k:'call', fn }),
  reset: team => ({ k:'reset', team }),
  place: (x, y) => ({ k:'place', x, y }),

const settle = () => ST.call(() => {
  const rp = restPoint();
  F.steps.unshift(ST.pass(nearest(F.us, rp, q => q.role !== 'G')));

function startStep(s){
  s.t0 = F.clock; const b = F.ball;

    s.dest = s.to.team ? { x:s.to.x, y:s.to.y } : { x:s.to.x, y:s.to.y };
    if (s.to.team) s.to.run = { ...s.dest };
    F.holder = null;
    const d = Math.hypot((s.dest.x - s.from.x) * F.W, (s.dest.y - s.from.y) * F.H);
    s.dur = s.dur || clamp(220 + d * 1.1, 260, 950);

    s.p.lock = true; s.from = { x:s.p.x, y:s.p.y }; F.holder = s.p;
  } else if (s.k === 'tackle'){

function showField(){

function tipFor(j){
  const p = P.prob, A = digitsOf(p.a, P.W), B = digitsOf(p.b, P.W);
  const s = p.rows ? P.steps.find(x => x.row === Math.floor(j / P.W) && (x.col === j % P.W || (x.extra && x.extra.col === j % P.W))) : P.steps[j];
  if (!s) return 'Den här rutan får minnessiffran från kolumnen till höger.';
  if (p.rows) return s.tip;
  if (p.op === '×') return `${COL[j]}: räkna ${A[j]} · ${p.b}${s.cin ? ` + minnessiffran ${s.cin}` : ''}. ${s.last ? 'Skriv hela svaret.' : 'Blir det 10 eller mer? Skriv entalssiffran här och minnessiffran ovanför nästa kolumn.'}`;
  if (p.op === '+'){
    const base = `${COL[j]}: räkna ${A[j]} + ${B[j]}${s.cin ? ' + minnessiffran 1' : ''}.`;
    return s.last ? `${base} Skriv svaret.` : `${base} Blir det 10 eller mer? Skriv bara entalssiffran här och sätt en 1:a ovanför ${COLPL[j + 1]}.`;
  }
  if (s.need){
    if (s.zero) return `${COL[j]}: ${s.pre} − ${B[j]} går inte, och det finns 0 ${col(j + 1)}. Växla först från kolumnen längre till vänster, sedan från ${COLPL[j + 1]}.`;
    return `${COL[j]}: ${s.pre} − ${B[j]} går inte. Tryck på siffran bland ${COLPL[j + 1]} för att växla 1 ${col(j + 1)} till 10 ${col(j)}.`;
  }

}
function submitProblem(pickedIdx){
  const p = P.prob; let ok, given;
  if (p.kind === 'column'){
    const sum = P.ans.slice(0, P.W);
    if (sum.some(v => v === '')){ P.msg = p.rows ? 'Fyll i hela svarsraden längst ner först.' : 'Fyll i alla rutor först.'; sfx('nope'); renderProblem(); return; }
    const val = fromDigits(sum.map(Number)); ok = val === p.ans; given = fmt(val);
  } else if (p.kind === 'choice'){
    P.picked = pickedIdx; ok = pickedIdx === p.correct; given = p.choices[pickedIdx];
  } else {
    if (P.vals.some(v => v === '' || v === '−' || v === '0,' && false)){ P.msg = 'Fyll i alla rutor först.'; sfx('nope'); renderProblem(); return; }
    ok = checkAnswer(p, P.vals);
    given = p.layout === 'frac' ? P.vals.join('/') : p.layout === 'time' ? P.vals.join(':') : p.layout === 'coord' ? `(${P.vals.join(', ')})` : P.vals.map((v, i) => v + (p.fields[i].suffix ? ' ' + p.fields[i].suffix : '')).join(' ');

    P.tries = 1; P.hint = true; if (P.o.onRetryUsed) P.o.onRetryUsed();
    P.msg = 'Assisterande tränaren: något blev fel. Kolla en gång till!';

    sfx('nope'); renderProblem(); return;
  }
  record(p.skill, ok, P.hint);
  if (ok){ sfx('good'); P.view = 'right'; P.fast = fast; renderProblem(); setTimeout(() => closeProblem({ correct:true, fast }), 950); }

}
function record(id, ok, helped){
  const k = save.skills[id]; if (!k) return;
  save.counter++;
  if (ok){ k.right++; k.last = save.counter; if (helped) k.help++; else k.box = Math.min(5, k.box + 1); }
  else { k.wrong++; k.box = Math.max(1, k.box - 2); k.last = save.counter - SPACING[k.box]; }
  save.stats.total++; if (ok) save.stats.right++;

}

function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.id = 'confetti'; fx.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const cols = ['#da291c', '#fbe122', '#ffffff', '#111111'];
  const ps = Array.from({ length:140 }, () => ({ x:innerWidth / 2 + (Math.random() - .5) * 200, y:innerHeight * .45, vx:(Math.random() - .5) * 16, vy:-Math.random() * 16 - 4,
    s:6 + Math.random() * 8, r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:pick(cols) }));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (t - t0 < 2400) requestAnimationFrame(f); else c.remove();
  })(t0);
}

function trainNext(){
  const o = { tier:train.d, eyebrow:'Träning', title:'Räkna', verb:'KOLLA', cancel:true, clock:false,
    onDone: res => {
      train.count++;
      if (res.correct){ train.right++; train.streak++; if (train.streak % 2 === 0) train.d = Math.min(4, train.d + 1); }
      else { train.streak = 0; train.d = Math.max(1, train.d - 1); }
      render(); setTimeout(trainNext, 250);
    } };
  if (train.code) o.code = train.code; else { o.league = train.league; o.level = train.level; }
  openProblem(o);
}

const ACT = {
  info(d){ info(d.k); },
  leagues(){ go('leagues'); },
  startLeague(d, b){ if (b && b.getAttribute('aria-disabled') === 'true'){ toast('Vinn nivån före först.'); sfx('nope'); return; } newRun(d.l, +d.v); },
  again(){ newRun(R.league, R.level); },
  wcPick(){ go('wcpick'); },
  wcBook(d){ wcTab = d.l; render(); },
  continueRun(){ R = save.run; go('map'); },
  home(){ confirmReset = false; go('title'); },
  startMatch, endTurn,
  play(d){ playCard(+d.i); },
  dive(d){ penDive(+d.c); },
  afterMatch,
  pickCard(d){ const id = R.offer[+d.i]; R.deck.push(id); noteLegend(id); sfx('good'); checkTrophies(); toRelicOrMap(); },
  skipCard(){ toRelicOrMap(); },
  pickRelic(d){ const k = R.relicOffer[+d.i]; if (RELICS[k].instant){ if (k === 'bus') R.hearts++; } else R.relics.push(k); sfx('good'); go('map'); },
  train(){ go('train'); },
  trainLeague(d){ train.league = d.l; render(); },
  trainSec(d){ train.code = d.c; train.d = 1; train.streak = 0; trainNext(); },
  trainMix(d){ train.code = null; train.level = +d.v; train.d = 1; train.streak = 0; trainNext(); },
  howto(){ go('howto'); }, adults(){ go('adults'); },
  library(){ go('library'); }, trophies(){ go('trophies'); }, daily(){ startDaily(); },
  libTab(d){ libView = d.k; render(); },
  example(d){ openProblem({ prob:{ ...EXAMPLES[d.ex], steps:[] }, example:true, eyebrow:'Exempel' }); },
  pickLogo(){ document.getElementById('logoFile').click(); },
  resetLogo(){ delete save.settings.logo; persist(); render(); },
  toggleSound(){ save.settings.sound = !save.settings.sound; persist(); render(); if (save.settings.sound) sfx('good'); },
  toggleClock(){ save.settings.clock = !save.settings.clock; persist(); render(); },
  reset(){ if (!confirmReset){ confirmReset = true; render(); return; } const s = save.settings; save = defaultSave(); save.settings = s; R = null; confirmReset = false; persist(); render(); toast('All statistik är nollställd.'); },
  // problem
  num(d){
    if (!P || P.view !== 'solve') return;
    if (P.prob.kind === 'column'){ if (d.d === ',') return; P.ans[P.cursor] = d.d; const k = P.cells.indexOf(P.cursor); if (k < P.cells.length - 1) moveCursor(P.cells[k + 1]); }
    else if (P.prob.kind === 'input'){
      let v = P.vals[P.field] || '';
      if (d.d === ','){ if (v.includes(',')) return; v = (v === '' || v === '−' ? v + '0' : v) + ','; }
      else { if (v.replace(/[−,]/g, '').length >= 9) return; v += d.d; }
      P.vals[P.field] = v;
    } else return;
    P.msg = ''; sfx('tap'); renderProblem();
  },
  back(){
    if (!P || P.view !== 'solve') return;
    if (P.prob.kind === 'column'){ const k = P.cells.indexOf(P.cursor); if (P.ans[P.cursor] === '' && k > 0) moveCursor(P.cells[k - 1]); P.ans[P.cursor] = ''; }
    else if (P.prob.kind === 'input'){ const v = P.vals[P.field] || ''; if (v === '' && P.field > 0) P.field--; else P.vals[P.field] = v.slice(0, -1); }
    renderProblem();
  },
  neg(){ if (!P || P.prob.kind !== 'input') return; const v = P.vals[P.field] || ''; P.vals[P.field] = v.startsWith('−') ? v.slice(1) : '−' + v; renderProblem(); },
  field(d){ if (!P) return; P.field = +d.k; renderProblem(); },
  nextField(){ if (!P || P.prob.kind !== 'input') return; P.field = (P.field + 1) % P.prob.fields.length; renderProblem(); },
  pickChoice(d){ if (!P || P.view !== 'solve' || P.prob.kind !== 'choice') return; submitProblem(+d.k); },
  cursor(d){ if (!P) return; moveCursor(+d.j); renderProblem(); },
  carry(d){ if (!P) return; const j = +d.j; P.carries[j] = P.prob.op === '×' ? ((P.carries[j] || 0) + 1) % 10 : (P.carries[j] ? 0 : 1); sfx('tap'); renderProblem(); },
  borrow(d){
    if (!P) return; const j = +d.j;
    if (P.tops[j] > 0 && P.tops[j - 1] < 10){ P.tops[j]--; P.tops[j - 1] += 10; P.changed[j] = P.changed[j - 1] = true; sfx('tap'); P.msg = ''; }
    else { P.msg = P.tops[j] === 0 ? `Det finns 0 ${col(j)} här. Växla först från kolumnen till vänster.` : 'Den kolumnen har redan växlat.'; sfx('nope'); }
    renderProblem();
  },
  undoBorrow(){ if (!P) return; P.tops = digitsOf(P.prob.a, P.W); P.changed = Array(P.W).fill(false); renderProblem(); },
  hint(){ if (!P) return; P.hint = true; P.hintText = P.prob.kind === 'column' ? tipFor(P.cursor) : P.prob.hint; renderProblem(); },
  submit(){ if (P && P.view === 'solve' && P.prob.kind !== 'choice') submitProblem(); },
  cancel(){ P = null; modal.hidden = true; modal.innerHTML = ''; },
  nextStep(){ if (!P) return; P.revealed++; sfx('tap'); renderProblem(); },
  solDone(){ if (!P) return; if (P.o.example){ ACT.cancel(); return; } closeProblem({ correct:false, fast:false }); },
};
Object.assign(ACT, {
  vs(){ vsForm.err = ''; vsForm.wait = false; if (!vsForm.name) vsForm.name = save.vsName || ''; go('vs'); },
  vsLeague(d){ vsForm.league = d.l; render(); },
  vsLevel(d){ vsForm.level = +d.v; render(); },
  vsKit(d){ vsForm.kit = d.k; render(); },
  async vsCreate(){
    if (vsForm.wait) return;
    const name = vsClean(vsForm.name);
    if (!name){ vsForm.err = 'Skriv ditt namn först.'; sfx('nope'); render(); return; }
    save.vsName = name; persist();
    vsForm.wait = true; vsForm.err = ''; render();
    const me = { name, league:vsForm.league, level:vsForm.level, kit:vsForm.kit };
    try {
      const r = await vsCall({ action:'create', ...me });
      VS = vsNew(me, r.code, 0, r.token); VS.phase = 'host'; vsSave();
      vsForm.wait = false; go('vsWait'); vsPollSoon(1000);
    } catch (e){ vsForm.wait = false; vsForm.err = vsErrText(e); render(); }
  },
  async vsJoin(){
    if (vsForm.wait) return;
    const name = vsClean(vsForm.name), code = String(vsForm.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!name){ vsForm.err = 'Skriv ditt namn först.'; sfx('nope'); render(); return; }
    if (code.length !== 4){ vsForm.err = 'Koden ska ha fyra tecken.'; sfx('nope'); render(); return; }
    save.vsName = name; persist();
    vsForm.wait = true; vsForm.err = ''; render();
    const me = { name, league:vsForm.league, level:vsForm.level, kit:vsForm.kit };
    try {
      const r = await vsCall({ action:'join', code, ...me });
      VS = vsNew(me, r.code, 1, r.token); VS.opp = r.opp; vsForm.wait = false; vsForm.code = '';
      sfx('good'); vsStartDraft(); vsPush();
    } catch (e){ vsForm.wait = false; vsForm.err = vsErrText(e); render(); }
  },
  async vsResume(){
    const s = vsSession(); if (!s){ render(); return; }
    VS = vsNew(s.me, s.code, s.seat, s.token); VS.opp = s.opp; VS.deck = s.deck;
    try {
      const st = await vsCall({ action:'state', code:s.code, seat:s.seat, token:s.token }), o = 1 - s.seat;
      VS.opp = st.seats[o] || VS.opp; VS.oppP = st.p[o]; VS.seen = st.seen[o]; VS.now = st.now;
      const mine = st.p[s.seat];
      if (mine) VS.myP = { turns:mine.turns || [], pens:mine.pens || [], picks:mine.picks || [], ready:!!mine.ready, quit:false, r:mine.r || 0, n:mine.n || 0 };
      if (VS.oppP && VS.oppP.quit){ vsWalkover(); return; }
      if (!VS.opp){ VS.phase = 'host'; go('vsWait'); }
      else if (!VS.myP.ready){ vsStartDraft(); }
      else if (!(VS.oppP && VS.oppP.ready)){ VS.deck = START_DECK.concat(VS.myP.picks); VS.phase = 'ready'; go('vsDraft'); }
      else { VS.deck = START_DECK.concat(VS.myP.picks); if (VS.myP.turns.length) vsStartMatch(true); else vsReveal(); }
      vsPollSoon(800);
    } catch (e){
      const gone = e.status === 404 || e.status === 403;
      if (gone) vsForget();
      VS = null; render(); toast(gone ? 'Matchen finns inte längre.' : vsErrText(e));
    }
  },
  vsPick(d){
    if (!VS || VS.phase !== 'draft') return;
    const id = VS.draft.packs[VS.draft.round].cards[+d.i]; if (!id) return;
    VS.myP.picks.push(id); VS.deck.push(id); noteLegend(id); sfx('good');
    libSee('cards', VS.draft.packs[VS.draft.round].cards); checkTrophies();
    VS.draft.round++;
    if (VS.draft.round >= VS_ROUNDS){ vsReady(); return; }
    vsSave(); vsPush(); render();
  },
  vsKickoff(){ if (VS && VS.phase === 'reveal') vsStartMatch(false); },
  vsHome(){ vsQuit(); go('title'); },
  vsLeave(){
    if (!vsLeaveArmed){ vsLeaveArmed = true; vsRefresh(); render(); return; }
    vsLeaveArmed = false; vsQuit(); go('title'); toast('Du lämnade matchen.');
  },
  vsClaim(){ if (M && M.vs && M.phase !== 'done') vsEnd('win', true); },
  vsAgain(){ VS = null; M = null; R = null; ACT.vs(); },
  vsDone(){ VS = null; M = null; R = null; go('title'); },
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'vsName') vsForm.name = t.value;
  if (t.id === 'vsCode'){ const v = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); if (v !== t.value) t.value = v; vsForm.code = v; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'vsCode') ACT.vsJoin();
});
function toRelicOrMap(){
  if (R.stage === 2 || R.stage === 4){ R.relicOffer = makeRelicOffer(); libSee('relics', R.relicOffer); go('relic'); }
  else go('map');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset, b);
});
document.addEventListener('keydown', e => {
  if (!P || P.view !== 'solve') return;
  if (/^[0-9]$/.test(e.key)) ACT.num({ d:e.key });
  else if (e.key === ',' || e.key === '.') ACT.num({ d:',' });
  else if (e.key === '-') ACT.neg();
  else if (e.key === 'Tab'){ e.preventDefault(); ACT.nextField(); }
  else if (e.key === 'Backspace') ACT.back();
  else if (e.key === 'Enter') ACT.submit();
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.getElementById('logoFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadLogo(f); e.target.value = ''; });
document.addEventListener('dblclick', e => e.preventDefault());

render();
</script>
